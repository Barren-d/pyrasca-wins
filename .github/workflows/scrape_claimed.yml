name: Claimed scrape (every 48 min)

on:
  # Every 48 minutes, offset +3 min: GitHub drops scheduled runs most often at
  # busy times, especially on the hour, so no run starts at :00.
  schedule:
    - cron: '3 0,4,8,12,16,20 * * *'
    - cron: '51 0,4,8,12,16,20 * * *'
    - cron: '39 1,5,9,13,17,21 * * *'
    - cron: '27 2,6,10,14,18,22 * * *'
    - cron: '15 3,7,11,15,19,23 * * *'
  workflow_dispatch:

# Never run two claimed scrapes at once (a delayed scheduled run could otherwise
# overlap the next one); a waiting run starts when the current one finishes.
concurrency:
  group: claimed-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Random delay (up to 5 minutes)
        run: sleep $((RANDOM % 300))

      - name: Run claimed scrape
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python scrape.py --mode claimed
